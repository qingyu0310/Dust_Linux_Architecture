# 视觉线程运行配置。DUST_CONFIG_ROOT 应指向包含 thread/ 的配置根目录，
# 当前源码树中对应 <repo>/project；模型文件仍是配置根之外的独立部署资源。

# 0526 TensorRT engine 的外部路径；不放入 build，也不由 CMake 生成。
engine_path: /home/qingyudd01/projects/vscode/opencv/build/0526.engine

# CUDA 设备编号；ArmorDetector 初始化时还会检查本机设备数量。
cuda_device: 0

# 0526 模型后处理门限。
score_threshold: 0.7
confidence_threshold: 0.8
nms_threshold: 0.3

# 局部灯条角点精修参数。精修器是否编进程序由构建期开关决定（CONFIG_DUST_VISION_YOLO_REFINER）；
# 编进来就用这些参数，字段必需。
brightness_threshold: 150
min_light_length_px: 8.0
min_light_ratio: 1.5
max_light_ratio: 20.0
max_light_tilt_deg: 45.0
max_endpoint_distance_px: 15.0

# ---- 相机内参与畸变：由标定组件产出，这里是唯一读它的地方 ----
# 标定跑完日志按同样的键名逐行打印，形如 `[inf] calib: camera_fx: 1803.947`，
# 取 "calib: " 后面那段替换下面 12 行即可。12 个键必须齐全。
# 当前值来自本机 2026-10-16 的标定结果（重投影误差 0.1062 px）。
image_width: 1440
image_height: 1080
camera_fx: 1799.539711
camera_fy: 1800.364749
camera_cx: 722.8841479
camera_cy: 504.3663714
distort_k1: -0.07677082222
distort_k2: 0.1417360699
distort_p1: -0.0004933148161
distort_p2: 0.001394902737
distort_k3: 0
reprojection_error_px: 0.106212

# ---- 装甲板位姿与整车参数 ----
# 装甲板物理尺寸（135/230/56 mm）是实测确定值，写在 armor_pose.hpp 的常量里，不在这里重复。

# 车体旋转半径初值，单位 m；只在跟踪器初始化时用，之后由观测修正。
# 0.2 是参考对普通步兵车的取值（tracker.cpp:391）。调大：收敛前外推更散；调小：无明显代价。
armor_radius_init_m: 0.2

# 整车装甲板数量。四面车为 4；收敛前不画另外三面。
armor_num: 4

# ---- 跟踪器滤波参数 ----
# 四点观测噪声基准，单位 pixel。调大：更不信观测，平滑但迟钝、收敛慢；
# 调小：跟得紧但抖。参考自认 8 px，本机实拍 PnP 重投影 2~4 px，先按 4 起调。
point_sigma_px: 4.0

# 观测噪声随距离平方放大的系数，单位 1/m²。噪声方差乘 (1 + k·d²)。
# 同样的像素误差，越远对应的三维误差越大（σ_d ∝ d²），所以远目标的观测该降权。
# 0 表示不缩放（常数噪声）；3 m 处取 0.05 约让噪声放大 1.45 倍。
sigma_distance_scale: 0.05

# 车心加速度方差。调大：允许车心急加速，机动跟得上但静止时抖；调小：假设匀速，静止稳但滞后。
accel_variance: 0.33

# 角加速度方差。调大：允许转速突变，换面跟得快但转速估计抖；调小：转速平滑但突变滞后。
angular_accel_variance: 3.3

# 半径/半径差/高度差的过程噪声。调大：l 收敛快但可能被噪声推离 0；调小：稳定但收得慢。
shape_variance: 0.1

# ---- 相机相对云台的外参：p_gimbal = R_camera2gimbal · p_camera + t_camera2gimbal ----
# R_camera2gimbal 用 Rodrigues 三元素表示。本机还没有云台、也没做手眼标定，所以这里先填
# 单位阵/零平移（0,0,0 即单位阵），此时跟踪器工作在相机系。等有云台并标定出外参后，
# 把 12 个数填进来即可让跟踪器输出云台系结果，算法不用改。
# R 填非单位阵会改变坐标含义：填错会让四面与画面里的板对不上。
gimbal_rvec_x: 0.0
gimbal_rvec_y: 0.0
gimbal_rvec_z: 0.0
gimbal_tx_m: 0.0
gimbal_ty_m: 0.0
gimbal_tz_m: 0.0
