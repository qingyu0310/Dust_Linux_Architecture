# 曝光时间，单位 μs；整数，范围 [1, 10000000]，初始化时除以 1000 换算为 ms。
# 3000 μs = 3 ms；增大可提高亮度，但会增加运动拖影，实际取值受设备范围限制（用 var list 看当前设备范围）。
exposure_us: 30000

# 相机增益，单位 dB；浮点数，配置校验范围 [0, 48]，实际取值须满足相机范围。
# 0 表示不增加增益；增大可提高亮度，也会放大图像噪声。
gain_db: 16.9

# 请求采集帧率，单位帧/秒（Hz）；整数，范围 [1, 1000]。
# 这里的上限只是防手滑，不是硬件上限：真正的上限由分辨率、曝光和链路带宽决定
# （1440x1080 Bayer8 在 USB3 上约 250 Hz，USB2 约 24 Hz；曝光时间超过帧周期时帧率 = 1/曝光）。
# 实际帧率不保证达到设置值，也不保证设备一定接受。
frame_rate: 30

# 单次 SDK 等待图像的超时时间，单位 ms；整数，范围 [1, 1000]。
# 调大：无帧时业务循环空转更少，但停止请求最多要等这么久才被响应；
# 调小：停止响应更快，无帧时空转更多。有帧时 SDK 立即返回，正常取帧不受此值影响。
# 超时后继续尝试采集并检查停止请求；此时间不包含像素转换和图像显示耗时。
timeout_ms: 100

# 连续未收到有效图像的最大允许时间，单位 ms；整数，范围 [1000, 60000]。
# 达到此时间后关闭设备并进入重连；收到有效帧后重新计时。
max_frame_gap_ms: 3000
