# 标定板规格：列数×行数与相邻圆心间距。必须与实际板子一致——参考工程曾把图案
# 写死成 10×7，与实际不符时 findCirclesGrid 静默失败，所以这三个是必需项。
pattern_cols: 9
pattern_rows: 6
center_distance_mm: 40.0

# 需要保留的合格样本数。每幅 54 点提供 108 个方程；9 幅对应 8 个内参 + 54 个外参（约 16:1 冗余）。
# 调小：采集快，但姿态覆盖差、畸变系数容易解歪；调大：更稳，操作者要多按几次快门。
sample_count: 9

# 一次快门算不算合格的门限。快门由 shell 的 calib.capture 触发，那一帧必须识别出完整
# 圆点阵，且与已保留样本至少有一项超过下面的门限（板心位移 px / 尺度比例 / 上下边比 / 左右边比），
# 才算新姿态；否则丢掉不保留。在 0.7 m、板宽 320 mm 下：80 px ≈ 横向 31 mm；
# 0.15 尺度 ≈ 前后 91 mm；0.10 边比 ≈ 偏转 12°。
# 调小：容易收进重复姿态，标定变差；调大：怎么摆都不合格，最后超时失败。
min_shift_px: 80.0
min_scale_change: 0.15
min_ratio_change: 0.10

# 两次保留之间的最短间隔，单位 ms。防连点，也给操作者把板停稳的时间；
# 运动模糊直接推高重投影误差。调大：按快了会被判不合格；调小：容易收进同一姿态的连拍。
sample_interval_ms: 500

# 采集总时限，单位 s。超时仍未凑满 sample_count 就判失败（启动中止）。
# 节奏由人按键决定，所以要留够摆 20 个姿态的余量。
capture_timeout_s: 300

# 重投影误差上限，单位 px。超过就判标定失败、不写文件。参考同款相机达到 0.0595 px。
max_reprojection_error_px: 0.3

# 合格样本的图片目录，相对配置根；按 1.jpg、2.jpg… 依次编号，供留档与离线复算。
samples_dir: calibration_samples

# 标定产物不写在这里：日志按同样的键名逐行打印，人把它们粘进
# thread/vision/trd_vision.yaml —— 内参和畸变只有视觉处理（PnP）要读。
